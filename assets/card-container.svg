<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0a1626" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes sweep { 0% { transform: translateX(-180px); } 100% { transform: translateX(560px); } }
      .pulse-dot { animation: pulse 1.9s ease-in-out infinite; }
      .shimmer { animation: sweep 4.5s linear infinite; }
    </style>
  </defs>

  <rect x="4" y="4" width="532" height="222" rx="16" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.8" />
  <rect x="4" y="4" width="8" height="222" rx="4" fill="url(#goGrad)" filter="url(#glow)" />

  <text x="26" y="32" fill="#38bdf8" class="mono" font-size="11" font-weight="bold">MODULE 03 // CLOUD INFRASTRUCTURE &amp; RUNTIMES</text>

  <rect x="364" y="16" width="154" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.2" />
  <circle cx="380" cy="28" r="4.5" fill="#fbbf24" class="pulse-dot" />
  <text x="392" y="32" fill="#fef3c7" class="mono" font-size="10.5" font-weight="bold">⚡ IN PROGRESS</text>

  <text x="26" y="66" fill="#ffffff" class="sans" font-size="21" font-weight="bold">container-engine</text>
  <text x="26" y="86" fill="#7dd3fc" class="mono" font-size="12" font-weight="bold">Custom Linux Container Runtime in Go</text>

  <text x="26" y="112" fill="#cbd5e1" class="sans" font-size="12.5">Docker-free container engine built from scratch in Go leveraging</text>
  <text x="26" y="130" fill="#cbd5e1" class="sans" font-size="12.5">Linux Namespaces, Cgroups v2 resource limits, OverlayFS &amp; Veth.</text>

  <g transform="translate(26, 146)">
    <rect x="0" y="0" width="76" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="38" y="15" fill="#bae6fd" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">Golang</text>

    <rect x="86" y="0" width="102" height="22" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-width="1" />
    <text x="137" y="15" fill="#e0f2fe" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">Namespaces</text>

    <rect x="198" y="0" width="96" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="246" y="15" fill="#a7f3d0" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">Cgroups v2</text>

    <rect x="304" y="0" width="92" height="22" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
    <text x="350" y="15" fill="#e9d5ff" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">OverlayFS</text>
  </g>

  <rect x="26" y="184" width="320" height="8" rx="4" fill="#0f172a" />
  <rect x="26" y="184" width="240" height="8" rx="4" fill="url(#amberGrad)" class="pulse-dot" />
  <text x="26" y="208" fill="#fbbf24" class="mono" font-size="10.5" font-weight="bold">STATUS: IN PROGRESS • ISOLATION &amp; NET R&amp;D</text>

  <rect x="368" y="178" width="150" height="32" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2" />
  <text x="443" y="198" fill="#ffffff" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">INSPECT REPO ↗</text>

  <rect x="0" y="4" width="120" height="2.5" fill="#38bdf8" class="shimmer" />
</svg>
