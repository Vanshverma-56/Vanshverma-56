<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 62" width="100%" height="62">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#190830" />
      <stop offset="60%" stop-color="#0d041c" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
      @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3.5px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .icon { animation: floatIcon 3.3s ease-in-out infinite 0.4s; }
      .dot { animation: pulse 1.8s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="2" y="2" width="776" height="58" rx="29" fill="url(#bg)" stroke="#facc15" stroke-width="2" />
  <rect x="14" y="2" width="85" height="3" fill="#00f2fe" />

  <g class="icon">
    <circle cx="36" cy="31" r="19" fill="#2e2105" stroke="#facc15" stroke-width="1.5" />
    <text x="36" y="37" font-size="17" text-anchor="middle">🐳</text>
  </g>

  <text x="68" y="36" fill="#ffffff" class="sans" font-size="16" font-weight="800">container-engine</text>
  <text x="216" y="36" fill="#fde047" class="mono" font-size="12.5" font-weight="bold">· Custom Linux Container Runtime</text>

  <!-- Status Pill -->
  <rect x="515" y="16" width="136" height="30" rx="15" fill="#2e2105" stroke="#facc15" stroke-width="1.2" />
  <circle cx="533" cy="31" r="4.5" fill="#facc15" class="dot" />
  <text x="546" y="35" fill="#fef08a" class="mono" font-size="11.5" font-weight="bold">IN PROGRESS</text>

  <text x="712" y="35" fill="#00f2fe" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">EXPAND ▾</text>
</svg>
