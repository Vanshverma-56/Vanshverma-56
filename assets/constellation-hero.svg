<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Ultra-clean dark ambient canvas -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814" />
      <stop offset="50%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#060814" />
    </linearGradient>

    <!-- Soft ambient aurora glows -->
    <radialGradient id="auroraCyan" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraViolet" cx="70%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldBubble" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.85" />
    </radialGradient>

    <radialGradient id="glassBubble" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </radialGradient>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

      @keyframes float1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(4px, -12px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-5px, -10px); }
      }
      @keyframes float3 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(3px, 11px); }
      }
      @keyframes pulseRing {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.03); }
      }
      @keyframes statusDot {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      .b1 { animation: float1 5.5s ease-in-out infinite; }
      .b2 { animation: float2 6.2s ease-in-out infinite 0.6s; }
      .b3 { animation: float3 5.8s ease-in-out infinite 1.2s; }
      .b4 { animation: float1 6.5s ease-in-out infinite 1.8s; }
      .b5 { animation: float2 5.2s ease-in-out infinite 0.9s; }
      .b6 { animation: float3 6.0s ease-in-out infinite 2.2s; }
      .dot { animation: statusDot 2.2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="24" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Aurora Lighting -->
  <rect width="1000" height="320" rx="24" fill="url(#auroraCyan)" />
  <rect width="1000" height="320" rx="24" fill="url(#auroraViolet)" />

  <!-- Subtle Constellation Connection Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.5">
    <line x1="500" y1="145" x2="155" y2="95" />
    <line x1="500" y1="145" x2="115" y2="225" />
    <line x1="500" y1="145" x2="290" y2="245" />
    <line x1="500" y1="145" x2="710" y2="245" />
    <line x1="500" y1="145" x2="885" y2="225" />
    <line x1="500" y1="145" x2="845" y2="95" />
  </g>

  <!-- Minimalist Orbital Rings -->
  <ellipse cx="500" cy="150" rx="260" ry="95" fill="none" stroke="#1e293b" stroke-width="1" />
  <ellipse cx="500" cy="150" rx="390" ry="125" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="6 8" />

  <!-- ===================================================================== -->
  <!-- CENTER IDENTITY CORE                                                  -->
  <!-- ===================================================================== -->
  <g>
    <rect x="330" y="92" width="340" height="106" rx="53" fill="#090d1a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <text x="500" y="138" fill="#ffffff" class="sans" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">Vansh Verma</text>
    <text x="500" y="164" fill="#94a3b8" class="sans" font-size="13.5" font-weight="500" text-anchor="middle">Systems, AI &amp; Mobile Architecture</text>
    
    <!-- Minimal Status Legend Pill -->
    <g transform="translate(388, 176)">
      <circle cx="8" cy="5" r="4" fill="#10b981" class="dot" />
      <text x="18" y="9" fill="#cbd5e1" class="mono" font-size="10">1 Completed</text>
      <circle cx="112" cy="5" r="4" fill="#f59e0b" class="dot" />
      <text x="122" y="9" fill="#cbd5e1" class="mono" font-size="10">5 In Progress</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- 6 FLOATING PROJECT BUBBLES (ORBITING NODES)                           -->
  <!-- ===================================================================== -->

  <!-- Bubble 1: MAD Assignment (Completed - Emerald Glow) -->
  <g class="b1">
    <circle cx="155" cy="95" r="42" fill="url(#emeraldBubble)" stroke="#10b981" stroke-width="2" filter="url(#softGlow)" />
    <circle cx="185" cy="65" r="6" fill="#10b981" stroke="#060814" stroke-width="2" class="dot" />
    <text x="155" y="92" fill="#ffffff" class="sans" font-size="16" font-weight="bold" text-anchor="middle">📱 MAD</text>
    <text x="155" y="110" fill="#6ee7b7" class="mono" font-size="9.5" font-weight="bold" text-anchor="middle">✔ DONE</text>
  </g>

  <!-- Bubble 2: BareMetalOs (In Progress - Cyan) -->
  <g class="b2">
    <circle cx="115" cy="225" r="38" fill="url(#glassBubble)" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="142" cy="198" r="5.5" fill="#f59e0b" stroke="#060814" stroke-width="2" class="dot" />
    <text x="115" y="222" fill="#f8fafc" class="sans" font-size="14" font-weight="bold" text-anchor="middle">⚙️ RTOS</text>
    <text x="115" y="238" fill="#7dd3fc" class="mono" font-size="9" text-anchor="middle">ARM64 C</text>
  </g>

  <!-- Bubble 3: container-engine (In Progress - Sky) -->
  <g class="b3">
    <circle cx="290" cy="245" r="38" fill="url(#glassBubble)" stroke="#0ea5e9" stroke-width="1.8" />
    <circle cx="317" cy="218" r="5.5" fill="#f59e0b" stroke="#060814" stroke-width="2" class="dot" />
    <text x="290" y="242" fill="#f8fafc" class="sans" font-size="14" font-weight="bold" text-anchor="middle">🐳 Engine</text>
    <text x="290" y="258" fill="#bae6fd" class="mono" font-size="9" text-anchor="middle">Golang</text>
  </g>

  <!-- Bubble 4: modular-gpt-engine (In Progress - Violet) -->
  <g class="b4">
    <circle cx="710" cy="245" r="38" fill="url(#glassBubble)" stroke="#a855f7" stroke-width="1.8" />
    <circle cx="737" cy="218" r="5.5" fill="#f59e0b" stroke="#060814" stroke-width="2" class="dot" />
    <text x="710" y="242" fill="#f8fafc" class="sans" font-size="14" font-weight="bold" text-anchor="middle">🧠 LLM</text>
    <text x="710" y="258" fill="#e9d5ff" class="mono" font-size="9" text-anchor="middle">PyTorch</text>
  </g>

  <!-- Bubble 5: mcp-power-bridge (In Progress - Amber) -->
  <g class="b5">
    <circle cx="885" cy="225" r="38" fill="url(#glassBubble)" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="912" cy="198" r="5.5" fill="#f59e0b" stroke="#060814" stroke-width="2" class="dot" />
    <text x="885" y="222" fill="#f8fafc" class="sans" font-size="14" font-weight="bold" text-anchor="middle">🔌 MCP</text>
    <text x="885" y="238" fill="#fde68a" class="mono" font-size="9" text-anchor="middle">FastMCP</text>
  </g>

  <!-- Bubble 6: ultron-hive-core (In Progress - Pink) -->
  <g class="b6">
    <circle cx="845" cy="95" r="38" fill="url(#glassBubble)" stroke="#ec4899" stroke-width="1.8" />
    <circle cx="872" cy="68" r="5.5" fill="#f59e0b" stroke="#060814" stroke-width="2" class="dot" />
    <text x="845" y="92" fill="#f8fafc" class="sans" font-size="14" font-weight="bold" text-anchor="middle">🕶️ Ultron</text>
    <text x="845" y="108" fill="#fbcfe8" class="mono" font-size="9" text-anchor="middle">Three.js</text>
  </g>
</svg>
