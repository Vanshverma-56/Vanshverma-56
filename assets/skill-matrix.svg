<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040710" />
      <stop offset="50%" stop-color="#091122" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes rotateRadar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulsePolygon { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.75; } }
      .radar-sweep { animation: rotateRadar 8s linear infinite; transform-origin: 205px 150px; }
      .poly-pulse { animation: pulsePolygon 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1100" height="280" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <text x="32" y="34" fill="#00f2fe" class="mono" font-size="13" font-weight="bold" letter-spacing="2">
    ⚡ ENGINEERING COMPETENCY RADAR &amp; DOMAIN TELEMETRY
  </text>
  <line x1="32" y1="46" x2="1068" y2="46" stroke="#1e293b" stroke-width="1.5" />

  <!-- LEFT: Animated Hexagonal Skill Radar -->
  <g>
    <!-- Radar Concentric Hexagons (Center: 205, 155) -->
    <polygon points="205,75 274,115 274,195 205,235 136,195 136,115" fill="none" stroke="#1e293b" stroke-width="1.2" />
    <polygon points="205,95 257,125 257,185 205,215 153,185 153,125" fill="none" stroke="#1e293b" stroke-width="1" />
    <polygon points="205,115 240,135 240,175 205,195 170,175 170,135" fill="none" stroke="#1e293b" stroke-width="0.8" />
    <line x1="205" y1="75" x2="205" y2="235" stroke="#1e293b" stroke-width="0.8" />
    <line x1="136" y1="115" x2="274" y2="195" stroke="#1e293b" stroke-width="0.8" />
    <line x1="274" y1="115" x2="136" y2="195" stroke="#1e293b" stroke-width="0.8" />

    <!-- Skill Coverage Polygon -->
    <polygon points="205,80 270,118 265,190 205,230 142,190 145,118" fill="#00f2fe" fill-opacity="0.22" stroke="#00f2fe" stroke-width="2" class="poly-pulse" filter="url(#glow)" />

    <!-- Radar Sweep Line -->
    <line x1="205" y1="155" x2="205" y2="75" stroke="#34d399" stroke-width="2" class="radar-sweep" filter="url(#glow)" />

    <!-- Vertex Nodes & Labels -->
    <circle cx="205" cy="80" r="4" fill="#00f2fe" />
    <text x="205" y="68" fill="#e2e8f0" class="mono" font-size="9.5" font-weight="bold" text-anchor="middle">OS KERNELS (C/ARM64)</text>

    <circle cx="270" cy="118" r="4" fill="#38bdf8" />
    <text x="284" y="116" fill="#e2e8f0" class="mono" font-size="9.5" font-weight="bold">CONTAINERS (GO)</text>

    <circle cx="265" cy="190" r="4" fill="#a855f7" />
    <text x="284" y="196" fill="#e2e8f0" class="mono" font-size="9.5" font-weight="bold">LLM / RAG (PYTHON)</text>

    <circle cx="205" cy="230" r="4" fill="#10b981" />
    <text x="205" y="252" fill="#10b981" class="mono" font-size="9.5" font-weight="bold" text-anchor="middle">ANDROID AI (KOTLIN)</text>

    <circle cx="142" cy="190" r="4" fill="#ec4899" />
    <text x="126" y="196" fill="#e2e8f0" class="mono" font-size="9.5" font-weight="bold" text-anchor="end">3D WEBGL (TS)</text>

    <circle cx="145" cy="118" r="4" fill="#f59e0b" />
    <text x="126" y="116" fill="#e2e8f0" class="mono" font-size="9.5" font-weight="bold" text-anchor="end">AGENTIC MCP</text>
  </g>

  <!-- RIGHT: Domain Mastery Bars -->
  <g transform="translate(435, 68)">
    <!-- Bar 1 -->
    <text x="0" y="16" fill="#ffffff" class="sans" font-size="13" font-weight="bold">Low-Level Systems &amp; OS Architecture</text>
    <text x="625" y="16" fill="#00f2fe" class="mono" font-size="11" font-weight="bold" text-anchor="end">BareMetalOs • ARM64 • VFS [95%]</text>
    <rect x="0" y="24" width="625" height="8" rx="4" fill="#0f172a" />
    <rect x="0" y="24" width="594" height="8" rx="4" fill="url(#cyanGrad)" filter="url(#glow)" />

    <!-- Bar 2 -->
    <text x="0" y="64" fill="#ffffff" class="sans" font-size="13" font-weight="bold">Linux Virtualization &amp; Container Runtimes</text>
    <text x="625" y="64" fill="#38bdf8" class="mono" font-size="11" font-weight="bold" text-anchor="end">container-engine • Go • Cgroups v2 [92%]</text>
    <rect x="0" y="72" width="625" height="8" rx="4" fill="#0f172a" />
    <rect x="0" y="72" width="575" height="8" rx="4" fill="url(#cyanGrad)" />

    <!-- Bar 3 -->
    <text x="0" y="112" fill="#ffffff" class="sans" font-size="13" font-weight="bold">Deep Learning, Transformers &amp; Agentic MCP</text>
    <text x="625" y="112" fill="#c084fc" class="mono" font-size="11" font-weight="bold" text-anchor="end">modular-gpt-engine &amp; mcp-power-bridge [94%]</text>
    <rect x="0" y="120" width="625" height="8" rx="4" fill="#0f172a" />
    <rect x="0" y="120" width="588" height="8" rx="4" fill="url(#purpleGrad)" filter="url(#glow)" />

    <!-- Bar 4 -->
    <text x="0" y="160" fill="#ffffff" class="sans" font-size="13" font-weight="bold">Mobile AI (Kotlin Compose) &amp; 3D WebGL HUDs</text>
    <text x="625" y="160" fill="#10b981" class="mono" font-size="11" font-weight="bold" text-anchor="end">MAD Assignment (✔ Done) &amp; ultron-hive-core [100%]</text>
    <rect x="0" y="168" width="625" height="8" rx="4" fill="#0f172a" />
    <rect x="0" y="168" width="625" height="8" rx="4" fill="url(#emeraldGrad)" filter="url(#glow)" />
  </g>
</svg>
