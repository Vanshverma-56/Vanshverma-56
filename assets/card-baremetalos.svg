<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#050912" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes sweep { 0% { transform: translateX(-180px); } 100% { transform: translateX(560px); } }
      .pulse-dot { animation: pulse 1.8s ease-in-out infinite; }
      .shimmer { animation: sweep 4.2s linear infinite; }
    </style>
  </defs>

  <!-- Outer Cyber Card Frame -->
  <rect x="4" y="4" width="532" height="222" rx="16" fill="url(#cardBg)" stroke="#00f2fe" stroke-width="1.8" />
  <rect x="4" y="4" width="8" height="222" rx="4" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- Top Header Strip -->
  <text x="26" y="32" fill="#38bdf8" class="mono" font-size="11" font-weight="bold">MODULE 02 // SYSTEMS &amp; KERNEL ENGINEERING</text>

  <!-- Status Pill: IN PROGRESS -->
  <rect x="364" y="16" width="154" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.2" />
  <circle cx="380" cy="28" r="4.5" fill="#fbbf24" class="pulse-dot" />
  <text x="392" y="32" fill="#fef3c7" class="mono" font-size="10.5" font-weight="bold">⚡ IN PROGRESS</text>

  <!-- Repo Title -->
  <text x="26" y="66" fill="#ffffff" class="sans" font-size="21" font-weight="bold">BareMetalOs</text>
  <text x="26" y="86" fill="#38bdf8" class="mono" font-size="12" font-weight="bold">ARM64 Micro-Kernel Real-Time OS (RTOS)</text>

  <!-- Description -->
  <text x="26" y="112" fill="#cbd5e1" class="sans" font-size="12.5">Custom ARM64 micro-kernel operating system engineered in C with</text>
  <text x="26" y="130" fill="#cbd5e1" class="sans" font-size="12.5">a Virtual File System (VFS), 3D graphics engine, crypto vault &amp; synth.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(26, 146)">
    <rect x="0" y="0" width="86" height="22" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-width="1" />
    <text x="43" y="15" fill="#bae6fd" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">C / ARM64</text>

    <rect x="96" y="0" width="96" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="144" y="15" fill="#e0f2fe" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">Custom VFS</text>

    <rect x="202" y="0" width="94" height="22" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
    <text x="249" y="15" fill="#e9d5ff" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">3D Engine</text>

    <rect x="306" y="0" width="76" height="22" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="344" y="15" fill="#fde68a" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">QEMU</text>
  </g>

  <!-- Bottom Progress & Action Bar -->
  <rect x="26" y="184" width="320" height="8" rx="4" fill="#0f172a" />
  <rect x="26" y="184" width="250" height="8" rx="4" fill="url(#amberGrad)" class="pulse-dot" />
  <text x="26" y="208" fill="#fbbf24" class="mono" font-size="10.5" font-weight="bold">STATUS: IN PROGRESS • ACTIVE KERNEL R&amp;D</text>

  <!-- Launch Button Graphic -->
  <rect x="368" y="178" width="150" height="32" rx="8" fill="#0284c7" stroke="#00f2fe" stroke-width="1.2" />
  <text x="443" y="198" fill="#ffffff" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">INSPECT REPO ↗</text>

  <!-- Top Laser Shimmer -->
  <rect x="0" y="4" width="120" height="2.5" fill="#00f2fe" class="shimmer" />
</svg>
