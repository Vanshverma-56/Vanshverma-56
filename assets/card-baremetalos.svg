<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140729" />
      <stop offset="55%" stop-color="#0d041c" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
      @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .icon { animation: floatIcon 3.4s ease-in-out infinite 0.3s; }
      .dot { animation: pulse 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Square Card Frame -->
  <rect x="6" y="6" width="408" height="408" rx="28" fill="url(#bg)" stroke="#00f2fe" stroke-width="2.5" />
  <rect x="36" y="6" width="120" height="4" fill="#facc15" />

  <!-- Top Row: Icon + In Progress Status Pill -->
  <g class="icon">
    <circle cx="62" cy="64" r="28" fill="#082f49" stroke="#00f2fe" stroke-width="2" filter="url(#glow)" />
    <text x="62" y="73" font-size="26" text-anchor="middle">⚙️</text>
  </g>

  <rect x="234" y="46" width="154" height="34" rx="17" fill="#2e2105" stroke="#facc15" stroke-width="1.5" />
  <circle cx="254" cy="63" r="5.5" fill="#facc15" class="dot" />
  <text x="268" y="67" fill="#fef08a" class="mono" font-size="12.5" font-weight="bold">IN PROGRESS</text>

  <!-- Repository Name & Subtitle -->
  <text x="34" y="138" fill="#ffffff" class="sans" font-size="25" font-weight="900">BareMetalOs</text>
  <text x="34" y="164" fill="#00f2fe" class="mono" font-size="13" font-weight="bold">ARM64 Micro-Kernel Real-Time OS</text>

  <!-- Divider -->
  <line x1="34" y1="184" x2="386" y2="184" stroke="#1e293b" stroke-width="1.5" />

  <!-- Purpose / Idea -->
  <text x="34" y="214" fill="#e2e8f0" class="sans" font-size="14">Lightweight ARM64 micro-kernel RTOS</text>
  <text x="34" y="236" fill="#e2e8f0" class="sans" font-size="14">featuring a custom VFS, 3D graphics engine,</text>
  <text x="34" y="258" fill="#e2e8f0" class="sans" font-size="14">cryptographic vault, audio synth &amp; QEMU.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(34, 286)">
    <rect x="0" y="0" width="96" height="28" rx="8" fill="#14092b" stroke="#00f2fe" stroke-width="1.2" />
    <text x="48" y="18" fill="#00f2fe" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">C / ARM64</text>

    <rect x="106" y="0" width="114" height="28" rx="8" fill="#14092b" stroke="#facc15" stroke-width="1.2" />
    <text x="163" y="18" fill="#fde047" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">Custom VFS</text>

    <rect x="230" y="0" width="114" height="28" rx="8" fill="#14092b" stroke="#ff007f" stroke-width="1.2" />
    <text x="287" y="18" fill="#ff66b2" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">3D Engine</text>
  </g>

  <!-- Bottom Redirect Action Bar -->
  <rect x="34" y="346" width="352" height="44" rx="14" fill="#00f2fe" filter="url(#glow)" />
  <text x="210" y="373" fill="#05020a" class="mono" font-size="13.5" font-weight="bold" text-anchor="middle">
    ↗ REDIRECT TO REPOSITORY
  </text>
</svg>
