<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d2e" />
      <stop offset="55%" stop-color="#0f0722" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
      @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .icon { animation: floatIcon 3.3s ease-in-out infinite 1.5s; }
      .dot { animation: pulse 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Square Card Frame -->
  <rect x="6" y="6" width="408" height="408" rx="28" fill="url(#bg)" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="36" y="6" width="120" height="4" fill="#ff007f" />

  <!-- Top Row: Icon + In Progress Status Pill -->
  <g class="icon">
    <circle cx="62" cy="64" r="28" fill="#0c243c" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <text x="62" y="73" font-size="26" text-anchor="middle">🕶️</text>
  </g>

  <rect x="234" y="46" width="154" height="34" rx="17" fill="#2e2105" stroke="#facc15" stroke-width="1.5" />
  <circle cx="254" cy="63" r="5.5" fill="#facc15" class="dot" />
  <text x="268" y="67" fill="#fef08a" class="mono" font-size="12.5" font-weight="bold">IN PROGRESS</text>

  <!-- Repository Name & Subtitle -->
  <text x="34" y="138" fill="#ffffff" class="sans" font-size="25" font-weight="900">ultron-hive-core</text>
  <text x="34" y="164" fill="#38bdf8" class="mono" font-size="13" font-weight="bold">3D Audio-Reactive Ultron AI HUD</text>

  <!-- Divider -->
  <line x1="34" y1="184" x2="386" y2="184" stroke="#1e293b" stroke-width="1.5" />

  <!-- Purpose / Idea -->
  <text x="34" y="214" fill="#e2e8f0" class="sans" font-size="14">Interactive 3D Ultron-themed AI interface</text>
  <text x="34" y="236" fill="#e2e8f0" class="sans" font-size="14">built with Next.js, Three.js &amp; Web Speech</text>
  <text x="34" y="258" fill="#e2e8f0" class="sans" font-size="14">API featuring dynamic core lighting.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(34, 286)">
    <rect x="0" y="0" width="112" height="28" rx="8" fill="#14092b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="56" y="18" fill="#7dd3fc" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">TypeScript</text>

    <rect x="122" y="0" width="102" height="28" rx="8" fill="#14092b" stroke="#ff007f" stroke-width="1.2" />
    <text x="173" y="18" fill="#ff66b2" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">Three.js</text>

    <rect x="234" y="0" width="110" height="28" rx="8" fill="#14092b" stroke="#facc15" stroke-width="1.2" />
    <text x="289" y="18" fill="#fde047" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">Next.js 3D</text>
  </g>

  <!-- Bottom Redirect Action Bar -->
  <rect x="34" y="346" width="352" height="44" rx="14" fill="#38bdf8" filter="url(#glow)" />
  <text x="210" y="373" fill="#05020a" class="mono" font-size="13.5" font-weight="bold" text-anchor="middle">
    ↗ REDIRECT TO REPOSITORY
  </text>
</svg>
