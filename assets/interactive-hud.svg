<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Background & Panel Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1326" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="cyberPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="visorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="screenGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <style>
      .font-mono { font-family: 'Courier New', Consolas, monospace; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes headBob {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(2.5px) rotate(0.8deg); }
      }
      @keyframes leftHandType {
        0%, 100% { transform: translateY(0px); }
        25% { transform: translateY(-3px); }
        50% { transform: translateY(1px); }
        75% { transform: translateY(-2px); }
      }
      @keyframes rightHandType {
        0%, 100% { transform: translateY(-2px); }
        25% { transform: translateY(1px); }
        50% { transform: translateY(-3px); }
        75% { transform: translateY(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { transform: translateY(460px); opacity: 0.15; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes dataStream {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }

      .float-panel-1 { animation: floatSlow 5s ease-in-out infinite; }
      .float-panel-2 { animation: floatFast 4.2s ease-in-out infinite 0.7s; }
      .float-panel-3 { animation: floatSlow 5.5s ease-in-out infinite 1.4s; }
      .char-head { animation: headBob 3.5s ease-in-out infinite; transform-origin: 450px 210px; }
      .hand-l { animation: leftHandType 0.45s ease-in-out infinite; }
      .hand-r { animation: rightHandType 0.45s ease-in-out infinite; }
      .pulse { animation: pulseGlow 2.4s ease-in-out infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
      .scan { animation: scanline 7s linear infinite; }
      .ring-cw { animation: spinSlow 22s linear infinite; transform-origin: 450px 235px; }
      .ring-ccw { animation: spinReverse 16s linear infinite; transform-origin: 450px 235px; }
      .stream-line { stroke-dasharray: 8 6; animation: dataStream 6s linear infinite; }
    </style>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="900" height="480" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect width="900" height="480" rx="18" fill="url(#grid)" />

  <!-- Ambient Center Core Glow -->
  <circle cx="450" cy="240" r="190" fill="#00f2fe" opacity="0.06" filter="url(#softGlow)" />
  <circle cx="450" cy="240" r="110" fill="#6366f1" opacity="0.09" filter="url(#softGlow)" />

  <!-- Rotating HUD Radar Rings Behind Character -->
  <g class="ring-cw" opacity="0.32">
    <circle cx="450" cy="235" r="145" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="28 14 6 14" />
    <circle cx="450" cy="235" r="160" fill="none" stroke="#6366f1" stroke-width="0.8" stroke-dasharray="4 18" />
  </g>
  <g class="ring-ccw" opacity="0.25">
    <circle cx="450" cy="235" r="125" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="45 25 10 25" />
  </g>

  <!-- Connecting Data Streams to Left & Right HUD Nodes -->
  <g fill="none" stroke-width="1.5" opacity="0.55">
    <!-- Left Streams -->
    <path d="M 330 180 L 275 130 L 245 130" stroke="#10b981" class="stream-line" />
    <path d="M 320 235 L 265 235 L 245 235" stroke="#00f2fe" class="stream-line" />
    <path d="M 330 290 L 275 340 L 245 340" stroke="#a855f7" class="stream-line" />
    <!-- Right Streams -->
    <path d="M 570 180 L 625 130 L 655 130" stroke="#38bdf8" class="stream-line" />
    <path d="M 580 235 L 635 235 L 655 235" stroke="#f59e0b" class="stream-line" />
    <path d="M 570 290 L 625 340 L 655 340" stroke="#10b981" class="stream-line" />
  </g>

  <!-- TOP HUD HEADER BAR -->
  <g>
    <path d="M 20 15 L 260 15 L 280 35 L 620 35 L 640 15 L 880 15 L 880 50 L 20 50 Z" fill="#090e1a" opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
    <line x1="280" y1="35" x2="620" y2="35" stroke="url(#cyberCyan)" stroke-width="2" filter="url(#glow)" />
    
    <!-- Top Left System Status -->
    <circle cx="40" cy="32" r="5" fill="#10b981" class="pulse" filter="url(#glow)" />
    <text x="54" y="36" fill="#94a3b8" class="font-mono" font-size="11" font-weight="bold">SYS.ONLINE // NEURAL_HUD_v4.2</text>

    <!-- Center Title -->
    <text x="450" y="25" fill="#00f2fe" class="font-mono" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="3">VANSH VERMA :: COMMAND DECK</text>

    <!-- Top Right Telemetry -->
    <text x="860" y="36" fill="#38bdf8" class="font-mono" font-size="11" font-weight="bold" text-anchor="end">REPOS: 06 | COMPLETED: 01 | ACTIVE: 05</text>
  </g>

  <!-- ========================================================= -->
  <!-- LEFT HUD NODES (3 REPOSITORIES)                           -->
  <!-- ========================================================= -->

  <!-- Node 1: MAD Assignment (COMPLETED) -->
  <g class="float-panel-1">
    <rect x="28" y="88" width="218" height="78" rx="8" fill="#0b1324" fill-opacity="0.9" stroke="#10b981" stroke-width="1.6" filter="url(#glow)" />
    <rect x="28" y="88" width="6" height="78" rx="3" fill="#10b981" />
    <text x="44" y="108" fill="#10b981" class="font-mono" font-size="10" font-weight="bold">● STATUS: COMPLETED [100%]</text>
    <text x="44" y="126" fill="#f8fafc" class="font-sans" font-size="13" font-weight="bold">N115_VanshV_Assignment1</text>
    <text x="44" y="143" fill="#94a3b8" class="font-sans" font-size="10">MAD Assignment • Gemini Compose</text>
    <!-- Progress Bar -->
    <rect x="44" y="152" width="186" height="5" rx="2.5" fill="#1e293b" />
    <rect x="44" y="152" width="186" height="5" rx="2.5" fill="url(#emeraldGrad)" />
  </g>

  <!-- Node 2: BareMetalOs (IN PROGRESS) -->
  <g class="float-panel-2">
    <rect x="28" y="196" width="218" height="78" rx="8" fill="#0b1324" fill-opacity="0.9" stroke="#00f2fe" stroke-width="1.2" />
    <rect x="28" y="196" width="6" height="78" rx="3" fill="#00f2fe" />
    <text x="44" y="216" fill="#fbbf24" class="font-mono" font-size="10" font-weight="bold">⚡ STATUS: IN PROGRESS</text>
    <text x="44" y="234" fill="#f8fafc" class="font-sans" font-size="13" font-weight="bold">BareMetalOs</text>
    <text x="44" y="251" fill="#94a3b8" class="font-sans" font-size="10">ARM64 Micro-Kernel RTOS in C</text>
    <rect x="44" y="260" width="186" height="5" rx="2.5" fill="#1e293b" />
    <rect x="44" y="260" width="145" height="5" rx="2.5" fill="url(#amberGrad)" class="pulse" />
  </g>

  <!-- Node 3: modular-gpt-engine (IN PROGRESS) -->
  <g class="float-panel-3">
    <rect x="28" y="304" width="218" height="78" rx="8" fill="#0b1324" fill-opacity="0.9" stroke="#a855f7" stroke-width="1.2" />
    <rect x="28" y="304" width="6" height="78" rx="3" fill="#a855f7" />
    <text x="44" y="324" fill="#fbbf24" class="font-mono" font-size="10" font-weight="bold">⚡ STATUS: IN PROGRESS</text>
    <text x="44" y="342" fill="#f8fafc" class="font-sans" font-size="13" font-weight="bold">modular-gpt-engine</text>
    <text x="44" y="359" fill="#94a3b8" class="font-sans" font-size="10">Custom Transformer LLM &amp; RAG</text>
    <rect x="44" y="368" width="186" height="5" rx="2.5" fill="#1e293b" />
    <rect x="44" y="368" width="135" height="5" rx="2.5" fill="url(#amberGrad)" class="pulse" />
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT HUD NODES (3 REPOSITORIES)                          -->
  <!-- ========================================================= -->

  <!-- Node 4: container-engine (IN PROGRESS) -->
  <g class="float-panel-2">
    <rect x="654" y="88" width="218" height="78" rx="8" fill="#0b1324" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <rect x="866" y="88" width="6" height="78" rx="3" fill="#38bdf8" />
    <text x="670" y="108" fill="#fbbf24" class="font-mono" font-size="10" font-weight="bold">⚡ STATUS: IN PROGRESS</text>
    <text x="670" y="126" fill="#f8fafc" class="font-sans" font-size="13" font-weight="bold">container-engine</text>
    <text x="670" y="143" fill="#94a3b8" class="font-sans" font-size="10">Go Linux Runtime • Cgroups v2</text>
    <rect x="670" y="152" width="182" height="5" rx="2.5" fill="#1e293b" />
    <rect x="670" y="152" width="140" height="5" rx="2.5" fill="url(#amberGrad)" class="pulse" />
  </g>

  <!-- Node 5: mcp-power-bridge (IN PROGRESS) -->
  <g class="float-panel-3">
    <rect x="654" y="196" width="218" height="78" rx="8" fill="#0b1324" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" />
    <rect x="866" y="196" width="6" height="78" rx="3" fill="#f59e0b" />
    <text x="670" y="216" fill="#fbbf24" class="font-mono" font-size="10" font-weight="bold">⚡ STATUS: IN PROGRESS</text>
    <text x="670" y="234" fill="#f8fafc" class="font-sans" font-size="13" font-weight="bold">mcp-power-bridge</text>
    <text x="670" y="251" fill="#94a3b8" class="font-sans" font-size="10">Python FastMCP Server Bridge</text>
    <rect x="670" y="260" width="182" height="5" rx="2.5" fill="#1e293b" />
    <rect x="670" y="260" width="150" height="5" rx="2.5" fill="url(#amberGrad)" class="pulse" />
  </g>

  <!-- Node 6: ultron-hive-core (IN PROGRESS) -->
  <g class="float-panel-1">
    <rect x="654" y="304" width="218" height="78" rx="8" fill="#0b1324" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.2" />
    <rect x="866" y="304" width="6" height="78" rx="3" fill="#ec4899" />
    <text x="670" y="324" fill="#fbbf24" class="font-mono" font-size="10" font-weight="bold">⚡ STATUS: IN PROGRESS</text>
    <text x="670" y="342" fill="#f8fafc" class="font-sans" font-size="13" font-weight="bold">ultron-hive-core</text>
    <text x="670" y="359" fill="#94a3b8" class="font-sans" font-size="10">3D Ultron AI HUD • Three.js</text>
    <rect x="670" y="368" width="182" height="5" rx="2.5" fill="#1e293b" />
    <rect x="670" y="368" width="130" height="5" rx="2.5" fill="url(#amberGrad)" class="pulse" />
  </g>

  <!-- ========================================================= -->
  <!-- CENTER MALE DEVELOPER AVATAR & HOLOGRAPHIC WORKSTATION     -->
  <!-- ========================================================= -->

  <!-- Gaming / Command Chair Backrest -->
  <path d="M 385 150 C 385 120, 515 120, 515 150 L 525 320 L 375 320 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
  <path d="M 398 160 L 502 160 L 508 310 L 392 310 Z" fill="#1e293b" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Male Developer Torso / Cyber Hoodie -->
  <g>
    <!-- Shoulders and Hoodie Body -->
    <path d="M 355 340 C 355 255, 395 235, 450 235 C 505 235, 545 255, 545 340 Z" fill="url(#hoodieGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Neon Techwear Collar & Seams -->
    <path d="M 410 238 L 430 285 L 450 275 L 470 285 L 490 238" fill="#090d16" stroke="#00f2fe" stroke-width="1.5" />
    <line x1="380" y1="265" x2="365" y2="335" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.7" />
    <line x1="520" y1="265" x2="535" y2="335" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.7" />
    <!-- Core Emblem on Chest -->
    <polygon points="450,285 462,297 450,309 438,297" fill="#00f2fe" opacity="0.85" filter="url(#glow)" class="pulse" />
  </g>

  <!-- Male Character Head (Animated Bobbing) -->
  <g class="char-head">
    <!-- Neck -->
    <rect x="434" y="212" width="32" height="32" rx="8" fill="#d99b78" />
    <!-- Shadow under chin -->
    <path d="M 434 222 Q 450 232 466 222 L 466 215 L 434 215 Z" fill="#b57856" />

    <!-- Head / Jawline (Masculine angular contour) -->
    <path d="M 412 152 C 412 125, 488 125, 488 152 L 486 192 C 486 212, 466 226, 450 226 C 434 226, 414 212, 414 192 Z" fill="#eab394" />

    <!-- Ears -->
    <rect x="406" y="168" width="8" height="20" rx="4" fill="#d99b78" />
    <rect x="486" y="168" width="8" height="20" rx="4" fill="#d99b78" />

    <!-- Cyber Headphones -->
    <path d="M 404 172 C 400 112, 500 112, 496 172" fill="none" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
    <path d="M 404 172 C 400 110, 500 110, 496 172" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
    <rect x="396" y="156" width="14" height="34" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow)" />
    <rect x="490" y="156" width="14" height="34" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow)" />

    <!-- Stylish Male Spiky/Textured Hair -->
    <path d="M 408 162 C 405 135, 420 112, 450 114 C 480 112, 495 135, 492 162 C 488 148, 478 140, 465 144 L 458 134 L 448 143 L 436 133 L 428 144 C 418 142, 412 150, 408 162 Z" fill="#0f172a" />
    <path d="M 418 128 L 432 115 L 442 124 L 458 110 L 466 123 L 482 118 L 476 132" fill="#1e293b" />

    <!-- Eyebrows -->
    <path d="M 424 162 Q 434 158 443 162" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <path d="M 457 162 Q 466 158 476 162" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

    <!-- AR Holographic Visor / Glasses -->
    <g filter="url(#glow)">
      <path d="M 415 165 L 485 165 L 481 184 L 455 184 L 450 178 L 445 184 L 419 184 Z" fill="url(#visorGlow)" stroke="#00f2fe" stroke-width="1.5" />
      <!-- HUD Reflection on Visor -->
      <line x1="422" y1="170" x2="438" y2="170" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
      <line x1="460" y1="170" x2="476" y2="170" stroke="#0284c7" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Subtle Confident Smirk -->
    <path d="M 442 204 Q 450 209 460 202" fill="none" stroke="#8c5336" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Holographic Projection Cone from Desk -->
  <polygon points="310,395 590,395 540,320 360,320" fill="url(#screenGlow)" />

  <!-- Typing Hands (Animated) -->
  <g class="hand-l">
    <ellipse cx="405" cy="356" rx="14" ry="9" fill="#eab394" stroke="#00f2fe" stroke-width="1" />
  </g>
  <g class="hand-r">
    <ellipse cx="495" cy="356" rx="14" ry="9" fill="#eab394" stroke="#00f2fe" stroke-width="1" />
  </g>

  <!-- Center Floating Holographic Terminal Monitor -->
  <g>
    <rect x="350" y="315" width="200" height="74" rx="8" fill="#050b16" fill-opacity="0.92" stroke="#00f2fe" stroke-width="1.8" filter="url(#glow)" />
    <!-- Terminal Top Bar -->
    <circle cx="364" cy="327" r="3" fill="#ef4444" />
    <circle cx="374" cy="327" r="3" fill="#f59e0b" />
    <circle cx="384" cy="327" r="3" fill="#10b981" />
    <text x="455" y="330" fill="#64748b" class="font-mono" font-size="8" text-anchor="middle">vansh@arch-core:~</text>
    
    <!-- Code Lines inside Terminal -->
