    <text x="362" y="360" fill="#10b981" class="font-mono" font-size="9.5">✔ [COMPLETED] N115_VanshV_Assignment1</text>
    <text x="362" y="374" fill="#fbbf24" class="font-mono" font-size="9.5">⚙ [BUILDING]  5 Systems Active...</text>
    <rect x="526" y="366" width="6" height="10" fill="#00f2fe" class="cursor" />
  </g>

  <!-- Cyber Desk Surface & Neon Edge -->
  <path d="M 210 395 L 690 395 L 750 445 L 150 445 Z" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
  <line x1="210" y1="395" x2="690" y2="395" stroke="url(#cyberCyan)" stroke-width="3" filter="url(#glow)" />

  <!-- Bottom Interactive Prompt Banner -->
  <g>
    <rect x="235" y="410" width="430" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="450" y="427" fill="#e2e8f0" class="font-mono" font-size="11" font-weight="bold" text-anchor="middle">
      ▼ INTERACT WITH CONSOLE MODULES BELOW TO INSPECT &amp; LAUNCH ▼
    </text>
  </g>

  <!-- Subtle Horizontal Scanline -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00f2fe" stroke-width="1.5" class="scan" />
</svg>
