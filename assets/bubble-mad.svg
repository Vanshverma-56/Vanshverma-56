<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 54" width="100%" height="54">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06281e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.5; r: 4.5px; } 50% { opacity: 1; r: 6px; } }
      .icon { animation: floatIcon 3s ease-in-out infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="2" y="2" width="756" height="50" rx="25" fill="url(#bg)" stroke="#10b981" stroke-width="1.5" />
  <g class="icon">
    <circle cx="30" cy="27" r="16" fill="#064e3b" stroke="#34d399" stroke-width="1.2" />
    <text x="30" y="32" font-size="15" text-anchor="middle">📱</text>
  </g>
  <text x="58" y="32" fill="#ffffff" class="sans" font-size="14.5" font-weight="700">MAD Assignment</text>
  <text x="184" y="32" fill="#94a3b8" class="mono" font-size="12">· N115_VanshV_Assignment1</text>

  <!-- Status Pill -->
  <rect x="505" y="13" width="126" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <circle cx="523" cy="27" r="5" fill="#34d399" class="dot" />
  <text x="536" y="31" fill="#ecfdf5" class="mono" font-size="11" font-weight="bold">Completed</text>

  <text x="692" y="31" fill="#6ee7b7" class="mono" font-size="11" text-anchor="middle">Expand ▾</text>
</svg>
