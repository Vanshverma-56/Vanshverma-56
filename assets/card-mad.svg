<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a221d" />
      <stop offset="55%" stop-color="#0f0722" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
      @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .icon { animation: floatIcon 3.2s ease-in-out infinite; }
      .dot { animation: pulse 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Square Card Frame -->
  <rect x="6" y="6" width="408" height="408" rx="28" fill="url(#bg)" stroke="#10b981" stroke-width="2.5" />
  <rect x="36" y="6" width="120" height="4" fill="#facc15" />

  <!-- Top Row: Icon + Completed Status Pill -->
  <g class="icon">
    <circle cx="62" cy="64" r="28" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <text x="62" y="73" font-size="26" text-anchor="middle">📱</text>
  </g>

  <rect x="234" y="46" width="154" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="254" cy="63" r="5.5" fill="#34d399" class="dot" />
  <text x="268" y="67" fill="#ecfdf5" class="mono" font-size="12.5" font-weight="bold">✔ COMPLETED</text>

  <!-- Repository Name & Subtitle -->
  <text x="34" y="138" fill="#ffffff" class="sans" font-size="23" font-weight="900">N115_VanshV_Assignment1</text>
  <text x="34" y="164" fill="#34d399" class="mono" font-size="13" font-weight="bold">MAD Assignment · Android Gemini AI</text>

  <!-- Divider -->
  <line x1="34" y1="184" x2="386" y2="184" stroke="#1e293b" stroke-width="1.5" />

  <!-- Purpose / Idea -->
  <text x="34" y="214" fill="#e2e8f0" class="sans" font-size="14">Native Android generative AI application</text>
  <text x="34" y="236" fill="#e2e8f0" class="sans" font-size="14">built with declarative Jetpack Compose UI</text>
  <text x="34" y="258" fill="#e2e8f0" class="sans" font-size="14">and Google Gemini API integration.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(34, 286)">
    <rect x="0" y="0" width="76" height="28" rx="8" fill="#14092b" stroke="#10b981" stroke-width="1.2" />
    <text x="38" y="18" fill="#6ee7b7" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">Kotlin</text>

    <rect x="86" y="0" width="136" height="28" rx="8" fill="#14092b" stroke="#00f2fe" stroke-width="1.2" />
    <text x="154" y="18" fill="#00f2fe" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">Jetpack Compose</text>

    <rect x="232" y="0" width="112" height="28" rx="8" fill="#14092b" stroke="#facc15" stroke-width="1.2" />
    <text x="288" y="18" fill="#fde047" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">Gemini API</text>
  </g>

  <!-- Bottom Redirect Action Bar -->
  <rect x="34" y="346" width="352" height="44" rx="14" fill="#10b981" filter="url(#glow)" />
  <text x="210" y="373" fill="#04130e" class="mono" font-size="13.5" font-weight="bold" text-anchor="middle">
    ↗ REDIRECT TO REPOSITORY
  </text>
</svg>
