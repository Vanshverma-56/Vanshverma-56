<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190a2e" />
      <stop offset="55%" stop-color="#0f051d" />
      <stop offset="100%" stop-color="#070210" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'Courier New', Consolas, monospace; }
      @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .icon { animation: floatIcon 3.6s ease-in-out infinite 1.2s; }
      .dot { animation: pulse 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Square Card Frame -->
  <rect x="6" y="6" width="408" height="408" rx="28" fill="url(#bg)" stroke="#a855f7" stroke-width="2.5" />
  <rect x="36" y="6" width="120" height="4" fill="#00f2fe" />

  <!-- Top Row: Icon + In Progress Status Pill -->
  <g class="icon">
    <circle cx="62" cy="64" r="28" fill="#2e1065" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
    <text x="62" y="73" font-size="26" text-anchor="middle">🔌</text>
  </g>

  <rect x="234" y="46" width="154" height="34" rx="17" fill="#2e2105" stroke="#facc15" stroke-width="1.5" />
  <circle cx="254" cy="63" r="5.5" fill="#facc15" class="dot" />
  <text x="268" y="67" fill="#fef08a" class="mono" font-size="12.5" font-weight="bold">IN PROGRESS</text>

  <!-- Repository Name & Subtitle -->
  <text x="34" y="138" fill="#ffffff" class="sans" font-size="25" font-weight="900">mcp-power-bridge</text>
  <text x="34" y="164" fill="#c084fc" class="mono" font-size="13" font-weight="bold">Model Context Protocol AI Server</text>

  <!-- Divider -->
  <line x1="34" y1="184" x2="386" y2="184" stroke="#1e293b" stroke-width="1.5" />

  <!-- Purpose / Idea -->
  <text x="34" y="214" fill="#e2e8f0" class="sans" font-size="14">Custom local MCP server built with Python</text>
  <text x="34" y="236" fill="#e2e8f0" class="sans" font-size="14">and FastMCP bridging AI assistants with</text>
  <text x="34" y="258" fill="#e2e8f0" class="sans" font-size="14">filesystem scanning, DB queries &amp; tools.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(34, 286)">
    <rect x="0" y="0" width="96" height="28" rx="8" fill="#14092b" stroke="#a855f7" stroke-width="1.2" />
    <text x="48" y="18" fill="#e9d5ff" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">FastMCP</text>

    <rect x="106" y="0" width="92" height="28" rx="8" fill="#14092b" stroke="#00f2fe" stroke-width="1.2" />
    <text x="152" y="18" fill="#00f2fe" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">Python</text>

    <rect x="208" y="0" width="136" height="28" rx="8" fill="#14092b" stroke="#facc15" stroke-width="1.2" />
    <text x="276" y="18" fill="#fde047" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">SQL / Host Bridge</text>
  </g>

  <!-- Bottom Redirect Action Bar -->
  <rect x="34" y="346" width="352" height="44" rx="14" fill="#a855f7" filter="url(#glow)" />
  <text x="210" y="373" fill="#ffffff" class="mono" font-size="13.5" font-weight="bold" text-anchor="middle">
    ↗ REDIRECT TO REPOSITORY
  </text>
</svg>
