<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c05" />
      <stop offset="50%" stop-color="#1c1308" />
      <stop offset="100%" stop-color="#0a0704" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feComposite in="SourceGraphic" in2="b" operator="over" />
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes sweep { 0% { transform: translateX(-180px); } 100% { transform: translateX(560px); } }
      .pulse-dot { animation: pulse 1.7s ease-in-out infinite; }
      .shimmer { animation: sweep 4.3s linear infinite; }
    </style>
  </defs>

  <rect x="4" y="4" width="532" height="222" rx="16" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.8" />
  <rect x="4" y="4" width="8" height="222" rx="4" fill="url(#amberGrad)" filter="url(#glow)" />

  <text x="26" y="32" fill="#fbbf24" class="mono" font-size="11" font-weight="bold">MODULE 05 // AGENTIC PROTOCOL INFRASTRUCTURE</text>

  <rect x="364" y="16" width="154" height="24" rx="12" fill="#451a03" stroke="#f59e0b" stroke-width="1.2" />
  <circle cx="380" cy="28" r="4.5" fill="#fbbf24" class="pulse-dot" />
  <text x="392" y="32" fill="#fef3c7" class="mono" font-size="10.5" font-weight="bold">⚡ IN PROGRESS</text>

  <text x="26" y="66" fill="#ffffff" class="sans" font-size="21" font-weight="bold">mcp-power-bridge</text>
  <text x="26" y="86" fill="#fde68a" class="mono" font-size="12" font-weight="bold">Model Context Protocol (MCP) Host Bridge</text>

  <text x="26" y="112" fill="#cbd5e1" class="sans" font-size="12.5">Custom local MCP server built with Python &amp; FastMCP to connect</text>
  <text x="26" y="130" fill="#cbd5e1" class="sans" font-size="12.5">AI agents with filesystem scanning, DB querying &amp; host automation.</text>

  <g transform="translate(26, 146)">
    <rect x="0" y="0" width="82" height="22" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="41" y="15" fill="#fde68a" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">FastMCP</text>

    <rect x="92" y="0" width="76" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="130" y="15" fill="#bae6fd" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">Python</text>

    <rect x="178" y="0" width="96" height="22" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="226" y="15" fill="#a7f3d0" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">SQLite / DB</text>

    <rect x="284" y="0" width="112" height="22" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
    <text x="340" y="15" fill="#e9d5ff" class="mono" font-size="10.5" font-weight="bold" text-anchor="middle">AI Tool Bridge</text>
  </g>

  <rect x="26" y="184" width="320" height="8" rx="4" fill="#0f172a" />
  <rect x="26" y="184" width="260" height="8" rx="4" fill="url(#amberGrad)" class="pulse-dot" />
  <text x="26" y="208" fill="#fbbf24" class="mono" font-size="10.5" font-weight="bold">STATUS: IN PROGRESS • MCP TOOLING EXPANSION</text>

  <rect x="368" y="178" width="150" height="32" rx="8" fill="#b45309" stroke="#fbbf24" stroke-width="1.2" />
  <text x="443" y="198" fill="#ffffff" class="mono" font-size="11.5" font-weight="bold" text-anchor="middle">INSPECT REPO ↗</text>

  <rect x="0" y="4" width="120" height="2.5" fill="#fbbf24" class="shimmer" />
</svg>
