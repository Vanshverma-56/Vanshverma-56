<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 54" width="100%" height="54">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#170d2a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      @keyframes floatIcon { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .icon { animation: floatIcon 3.1s ease-in-out infinite 0.9s; }
      .dot { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect x="2" y="2" width="756" height="50" rx="25" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />
  <g class="icon">
    <circle cx="30" cy="27" r="16" fill="#2e1065" stroke="#a855f7" stroke-width="1.2" />
    <text x="30" y="32" font-size="15" text-anchor="middle">🧠</text>
  </g>
  <text x="58" y="32" fill="#ffffff" class="sans" font-size="14.5" font-weight="700">modular-gpt-engine</text>
  <text x="212" y="32" fill="#94a3b8" class="sans" font-size="12.5">· Custom Transformer LLM &amp; RAG</text>

  <!-- Status Pill -->
  <rect x="505" y="13" width="126" height="28" rx="14" fill="#2e1605" stroke="#f59e0b" stroke-width="1" />
  <circle cx="521" cy="27" r="4.5" fill="#fbbf24" class="dot" />
  <text x="533" y="31" fill="#fef3c7" class="mono" font-size="11" font-weight="bold">In Progress</text>

  <text x="692" y="31" fill="#94a3b8" class="mono" font-size="11" text-anchor="middle">Expand ▾</text>
</svg>
